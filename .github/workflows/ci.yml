name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Tests
        # The live vocabulary check skips itself without an API key, so this
        # exercises the offline suite only. No secrets reach CI.
        run: uv run --python ${{ matrix.python-version }} python3 -m unittest discover -s tests -v

  lint:
    name: lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Pre-commit
        # Runs ruff, the file checks, detect-secrets (against the committed
        # baseline) and gitleaks. Everything a local `git commit` would run.
        run: uvx pre-commit run --all-files --show-diff-on-failure

  install:
    name: install and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install as a tool
        run: uv tool install .

      - name: Smoke test
        # Proves the console entry point works without touching a mailbox:
        # --version and --help must not need a config or a network.
        run: |
          mail-classify --version
          mail-classify --help
