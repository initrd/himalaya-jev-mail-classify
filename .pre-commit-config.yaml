# Pre-commit hooks. Install once per clone:
#
#     uv tool install pre-commit   # or: pipx install pre-commit
#     pre-commit install
#
# Then every `git commit` runs these against the staged files.
# Run across the whole repo on demand:
#
#     pre-commit run --all-files
#
# Update the pinned revisions:
#
#     pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # Secret scanning. detect-secrets keeps a baseline of known-safe findings so
  # the hook only fails on *new* high-entropy strings - without it, every
  # example API key in the docs would trip it.
  #
  # After auditing a finding as safe, re-baseline with:
  #     detect-secrets scan --baseline .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^\.secrets\.baseline$

  # Second, independent scanner with a different rule set. Catches provider
  # token formats detect-secrets may not know about.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
