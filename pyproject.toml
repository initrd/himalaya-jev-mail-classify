[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-classify"
dynamic = ["version"]
description = "Label and prioritise Gmail with Jev (TypeSafe) over OpenRouter, driven from himalaya"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["email", "gmail", "llm", "classification", "labelling", "typesafe", "jev", "himalaya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = ["typesafe-sdk>=0.7.1"]

[project.urls]
Homepage = "https://github.com/initrd/mail-classify"
Issues = "https://github.com/initrd/mail-classify/issues"

[project.scripts]
mail-classify = "mail_classify:main"

[tool.hatch.version]
path = "mail_classify.py"

[tool.hatch.build.targets.wheel]
only-include = ["mail_classify.py"]

[tool.uv]
package = true

# --------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "contrib"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is the formatter's job
    "SIM105", # contextlib.suppress is less readable than try/except here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"] # imports follow the sys.path manipulation

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
